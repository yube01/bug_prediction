<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <style>
    .border-box { fill: #ffffff; stroke: #111111; stroke-width: 1.5; }
    .title-text { font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; font-size: 13px; fill: #111111; }
    .header-text { font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; font-size: 16px; fill: #111111; }
    .value-text { font-family: 'Consolas', 'Courier New', monospace; font-weight: bold; font-size: 14px; fill: #111111; }
    .label-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; fill: #555555; }
    .divider { stroke: #e5e7eb; stroke-width: 1; }
  </style>

  <!-- Solid white background for printing/document integration -->
  <rect width="900" height="340" fill="#ffffff" />

  <!-- Main Title -->
  <g transform="translate(40, 35)">
    <text class="header-text">Defect Prediction Model V4 Performance Metrics (Updated)</text>
    <line x1="0" y1="10" x2="820" y2="10" stroke="#111111" stroke-width="2" />
  </g>

  <!-- ROW 1 (3 Columns) -->
  <!-- Card 1: Accuracy -->
  <g transform="translate(40, 80)">
    <rect class="border-box" width="260" height="95" rx="4" />
    <text x="15" y="22" class="title-text">Accuracy (Overall Correctness)</text>
    <text x="15" y="42" class="value-text">Result: 88.50%</text>
    <line x1="15" y1="50" x2="245" y2="50" class="divider" />
    <text x="15" y="66" class="label-text">Percentage of all commits (both clean and</text>
    <text x="15" y="80" class="label-text">buggy) that the model classified correctly.</text>
  </g>

  <!-- Card 2: Precision -->
  <g transform="translate(320, 80)">
    <rect class="border-box" width="260" height="95" rx="4" />
    <text x="15" y="22" class="title-text">Precision (Warning Accuracy)</text>
    <text x="15" y="42" class="value-text">Result: 77.30%</text>
    <line x1="15" y1="50" x2="245" y2="50" class="divider" />
    <text x="15" y="66" class="label-text">Out of all commits flagged as buggy,</text>
    <text x="15" y="80" class="label-text">77.30% of them actually had true defects.</text>
  </g>

  <!-- Card 3: Recall -->
  <g transform="translate(600, 80)">
    <rect class="border-box" width="260" height="95" rx="4" />
    <text x="15" y="22" class="title-text">Recall (Bug Catching Rate)</text>
    <text x="15" y="42" class="value-text">Result: 81.60%</text>
    <line x1="15" y1="50" x2="245" y2="50" class="divider" />
    <text x="15" y="66" class="label-text">The system successfully catches 81.60%</text>
    <text x="15" y="80" class="label-text">of all actual bugs present in the commits.</text>
  </g>

  <!-- ROW 2 (2 Centered Columns) -->
  <!-- Card 4: F1-score -->
  <g transform="translate(180, 200)">
    <rect class="border-box" width="260" height="95" rx="4" />
    <text x="15" y="22" class="title-text">F1-Score (Balanced Performance)</text>
    <text x="15" y="42" class="value-text">Result: 79.40%</text>
    <line x1="15" y1="50" x2="245" y2="50" class="divider" />
    <text x="15" y="66" class="label-text">The balanced overall average of both the</text>
    <text x="15" y="80" class="label-text">Precision (77.3%) and Recall (81.6%) rates.</text>
  </g>

  <!-- Card 5: ROC-AUC Score -->
  <g transform="translate(460, 200)">
    <rect class="border-box" width="260" height="95" rx="4" />
    <text x="15" y="22" class="title-text">ROC-AUC Score (Sorting Accuracy)</text>
    <text x="15" y="42" class="value-text">Result: 86.35%</text>
    <line x1="15" y1="50" x2="245" y2="50" class="divider" />
    <text x="15" y="66" class="label-text">86.35% chance the model rates a truly</text>
    <text x="15" y="80" class="label-text">buggy commit as riskier than a clean one.</text>
  </g>
</svg>
