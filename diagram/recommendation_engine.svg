<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <style>
    .border-box { fill: #ffffff; stroke: #111111; stroke-width: 1.5; }
    .arrow { stroke: #111111; stroke-width: 1.5; fill: none; }
    .title-text { font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; font-size: 13px; fill: #111111; }
    .header-text { font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; font-size: 16px; fill: #111111; }
    .label-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #444444; }
    .code-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; fill: #111111; font-weight: bold; }
    .divider { stroke: #e5e7eb; stroke-width: 1; }
  </style>

  <!-- Solid white background for printing/document integration -->
  <rect width="920" height="380" fill="#ffffff" />

  <!-- Main Title -->
  <g transform="translate(40, 35)">
    <text class="header-text">Risk Factor &amp; Recommendation Engine Workflow</text>
    <line x1="0" y1="10" x2="840" y2="10" stroke="#111111" stroke-width="2" />
  </g>

  <!-- 1. INPUTS -->
  <g transform="translate(40, 75)">
    <rect class="border-box" width="180" height="260" rx="4" />
    <text x="15" y="25" class="title-text">1. Input Payload</text>
    <line x1="15" y1="32" x2="165" y2="32" class="divider" />
    
    <text x="15" y="55" class="title-text" font-size="11">Model Output:</text>
    <text x="25" y="75" class="code-text">Calibrated_P</text>
    <text x="25" y="90" class="label-text">(value: 0.00 to 1.00)</text>

    <line x1="15" y1="110" x2="165" y2="110" class="divider" />

    <text x="15" y="130" class="title-text" font-size="11">Commit Features:</text>
    <text x="25" y="150" class="label-text">• lines_added</text>
    <text x="25" y="165" class="label-text">• avg_complexity</text>
    <text x="25" y="180" class="label-text">• prior_bugs_author</text>
    <text x="25" y="195" class="label-text">• test_ratio</text>
    <text x="25" y="210" class="label-text">• churn_ratio</text>
    <text x="25" y="225" class="label-text">• timing indicators</text>
  </g>

  <!-- DIVERGING ARROWS -->
  <!-- Upper Path to Classifier -->
  <path d="M 220,150 L 260,110 L 290,110" class="arrow" />
  <polygon points="290,110 282,106 282,114" fill="#111111" />
  
  <!-- Lower Path to Extractor -->
  <path d="M 220,260 L 260,300 L 290,300" class="arrow" />
  <polygon points="290,300 282,296 282,304" fill="#111111" />

  <!-- 2A. PROBABILITY CLASS BAND MATCHING -->
  <g transform="translate(300, 75)">
    <rect class="border-box" width="300" height="145" rx="4" />
    <text x="15" y="22" class="title-text">2A. Probability Risk Classifier</text>
    <line x1="15" y1="28" x2="285" y2="28" class="divider" />

    <!-- High Risk Rule -->
    <text x="15" y="47" class="code-text">P &gt;= 0.450</text>
    <text x="110" y="47" class="label-text">→ HIGH RISK (🔴)</text>
    <text x="15" y="59" class="label-text" font-size="9" fill="#555555">Rec: Mandatory review required</text>

    <!-- Medium Risk Rule -->
    <text x="15" y="79" class="code-text">0.240 &lt;= P &lt; 0.450</text>
    <text x="160" y="79" class="label-text">→ MEDIUM RISK (🟡)</text>
    <text x="15" y="91" class="label-text" font-size="9" fill="#555555">Rec: Review recommended</text>

    <!-- Low Risk Rule -->
    <text x="15" y="111" class="code-text">P &lt; 0.240</text>
    <text x="100" y="111" class="label-text">→ LOW RISK (🟢)</text>
    <text x="15" y="123" class="label-text" font-size="9" fill="#555555">Rec: Safe to merge</text>
  </g>

  <!-- 2B. FEATURE-LEVEL RISK FACTOR EXTRACTION (HEURISTICS USED HERE) -->
  <g transform="translate(300, 235)">
    <rect class="border-box" width="300" height="100" rx="4" />
    <text x="15" y="20" class="title-text">2B. Heuristic Risk Extractor</text>
    <line x1="15" y1="25" x2="285" y2="25" class="divider" />

    <text x="15" y="40" class="label-text" font-size="9.5">• Size: lines &gt;= 300  or  complexity &gt;= 10</text>
    <text x="15" y="53" class="label-text" font-size="9.5">• Churn/Tests: churn &gt;= 5x  or  test == 0</text>
    <text x="15" y="66" class="label-text" font-size="9.5">• Author track record: prior_bugs_author &gt;= 3</text>
    <text x="15" y="79" class="label-text" font-size="9.5">• Timing: weekend or late-night edits</text>
    <text x="15" y="92" class="label-text" font-size="8.5" font-style="italic" fill="#666666">Extracts top 3 matched heuristic risk reasons</text>
  </g>

  <!-- CONVERGING ARROWS -->
  <!-- Upper Path to Output -->
  <path d="M 600,150 L 630,150 L 670,185" class="arrow" />
  <polygon points="670,185 668,176 662,181" fill="#111111" />
  
  <!-- Lower Path to Output -->
  <path d="M 600,285 L 630,285 L 670,225" class="arrow" />
  <polygon points="670,225 662,229 668,234" fill="#111111" />

  <!-- 3. OUTPUT RESPONSE PAYLOAD -->
  <g transform="translate(680, 75)">
    <rect class="border-box" width="200" height="260" rx="4" />
    <text x="15" y="25" class="title-text">3. PredictionResponse</text>
    <line x1="15" y1="32" x2="185" y2="32" class="divider" />

    <text x="15" y="55" class="code-text" font-size="10.5">"bug_probability": 0.3850</text>
    
    <text x="15" y="80" class="code-text" font-size="10.5">"risk_level": "MEDIUM RISK"</text>
    
    <text x="15" y="105" class="code-text" font-size="10.5">"risk_icon": "🟡"</text>
    
    <text x="15" y="130" class="code-text" font-size="10.5">"recommendation":</text>
    <text x="15" y="145" class="label-text" font-size="10">"Review recommended.</text>
    <text x="15" y="158" class="label-text" font-size="10">Check test coverage..."</text>

    <text x="15" y="185" class="code-text" font-size="10.5">"top_risk_factors": [</text>
    <text x="25" y="202" class="label-text" font-size="10">"Late night commit",</text>
    <text x="25" y="215" class="label-text" font-size="10">"High cyclomatic</text>
    <text x="25" y="228" class="label-text" font-size="10"> complexity (10.0)"</text>
    <text x="15" y="245" class="code-text" font-size="10.5">]</text>
  </g>
</svg>
