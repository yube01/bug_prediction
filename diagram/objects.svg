<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 950" width="100%" height="100%" style="background-color: white; font-family: Arial, sans-serif;">
  <defs>
    <!-- Filled Diamond for Composition -->
    <marker id="comp-diamond" markerWidth="20" markerHeight="20" refX="0" refY="10" orient="auto">
      <polygon points="0,10 10,5 20,10 10,15" fill="#fff" stroke="#000" stroke-width="1.5"/>
    </marker>
    <!-- Hollow Diamond for Aggregation -->
    <marker id="agg-diamond" markerWidth="20" markerHeight="20" refX="0" refY="10" orient="auto">
      <polygon points="0,10 10,5 20,10 10,15" fill="#fff" stroke="#000" stroke-width="1.5"/>
    </marker>
    <!-- Style for text -->
    <style>
      .title { font-weight: bold; text-decoration: underline; font-size: 14px; }
      .attr { font-size: 13px; fill: #000; }
      .box { fill: #fff; stroke: #000; stroke-width: 1.5; }
      .line { stroke: #000; stroke-width: 1.5; fill: none; }
      .label { font-size: 12px; font-style: italic; fill: #333; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="2" y="2" width="1096" height="946" fill="none" stroke="#ccc" stroke-width="1"/>

  <!-- ================= OBJECTS ================= -->

  <!-- Session Object -->
  <rect x="150" y="50" width="220" height="110" class="box"/>
  <text x="260" y="75" text-anchor="middle" class="title">session1: UserSession</text>
  <line x1="150" y1="85" x2="370" y2="85" class="line"/>
  <text x="160" y="105" class="attr">tokenType = "Bearer"</text>
  <text x="160" y="125" class="attr">expiresIn = "7 days"</text>
  <text x="160" y="145" class="attr">algorithm = "HS256"</text>

  <!-- Developer Object -->
  <rect x="450" y="50" width="220" height="130" class="box"/>
  <text x="560" y="75" text-anchor="middle" class="title">user1: User</text>
  <line x1="450" y1="85" x2="670" y2="85" class="line"/>
  <text x="460" y="105" class="attr">id = "u-9a8b7c"</text>
  <text x="460" y="125" class="attr">fullName = "Alex Smith"</text>
  <text x="460" y="145" class="attr">email = "alex@example.com"</text>
  <text x="460" y="165" class="attr">createdAt = "2026-07-21 12:46"</text>

  <!-- Dashboard Object -->
  <rect x="450" y="250" width="220" height="100" class="box"/>
  <text x="560" y="275" text-anchor="middle" class="title">stats1: DashboardStats</text>
  <line x1="450" y1="285" x2="670" y2="285" class="line"/>
  <text x="460" y="305" class="attr">totalRepos = 4</text>
  <text x="460" y="325" class="attr">totalCommitsParsed = 320</text>
  <text x="460" y="345" class="attr">overallHighRisk = 45</text>

  <!-- Repository Object -->
  <rect x="50" y="450" width="220" height="110" class="box"/>
  <text x="160" y="475" text-anchor="middle" class="title">history1: SearchHistory</text>
  <line x1="50" y1="485" x2="270" y2="485" class="line"/>
  <text x="60" y="505" class="attr">id = "sh-1a2b3c"</text>
  <text x="60" y="525" class="attr">repoName = "facebook/react"</text>
  <text x="60" y="545" class="attr">branch = "main"</text>

  <!-- Analysis Request Object -->
  <rect x="310" y="450" width="220" height="110" class="box"/>
  <text x="420" y="475" text-anchor="middle" class="title">req1: BatchRequest</text>
  <line x1="310" y1="485" x2="530" y2="485" class="line"/>
  <text x="320" y="505" class="attr">totalCommits = 120</text>
  <text x="320" y="525" class="attr">isWeekendCommits = 14</text>
  <text x="320" y="545" class="attr">language = "TypeScript"</text>

  <!-- Prediction Record Object -->
  <rect x="570" y="450" width="220" height="130" class="box"/>
  <text x="680" y="475" text-anchor="middle" class="title">pred1: PredictionResponse</text>
  <line x1="570" y1="485" x2="790" y2="485" class="line"/>
  <text x="580" y="505" class="attr">bugProbability = 0.485</text>
  <text x="580" y="525" class="attr">riskLevel = "HIGH RISK"</text>
  <text x="580" y="545" class="attr">riskIcon = "🔴"</text>
  <text x="580" y="565" class="attr">riskScore = 48</text>

  <!-- Code Review Object -->
  <rect x="830" y="450" width="220" height="110" class="box"/>
  <text x="940" y="475" text-anchor="middle" class="title">resp1: BatchResponse</text>
  <line x1="830" y1="485" x2="1050" y2="485" class="line"/>
  <text x="840" y="505" class="attr">total = 120</text>
  <text x="840" y="525" class="attr">highRiskCount = 18</text>
  <text x="840" y="545" class="attr">mediumRiskCount = 32</text>

  <!-- Commit Object -->
  <rect x="50" y="620" width="220" height="130" class="box"/>
  <text x="160" y="645" text-anchor="middle" class="title">commit1: CommitFeatures</text>
  <line x1="50" y1="655" x2="270" y2="655" class="line"/>
  <text x="60" y="675" class="attr">linesAdded = 450.0</text>
  <text x="60" y="695" class="attr">linesDeleted = 80.0</text>
  <text x="60" y="715" class="attr">filesChanged = 15.0</text>
  <text x="60" y="735" class="attr">priorBugsAuthor = 5.0</text>

  <!-- Commit Features Object -->
  <rect x="50" y="800" width="220" height="110" class="box"/>
  <text x="160" y="825" text-anchor="middle" class="title">derived1: DerivedFeatures</text>
  <line x1="50" y1="835" x2="270" y2="835" class="line"/>
  <text x="60" y="855" class="attr">nightXComplexity = 104.5</text>
  <text x="60" y="875" class="attr">weekendXLines = 450.0</text>
  <text x="60" y="895" class="attr">sizeXComplexity = 5625.0</text>

  <!-- ML Model Object -->
  <rect x="570" y="640" width="220" height="110" class="box"/>
  <text x="680" y="665" text-anchor="middle" class="title">model1: CalibratedModel</text>
  <line x1="570" y1="675" x2="790" y2="675" class="line"/>
  <text x="580" y="695" class="attr">modelType = "xgboost"</text>
  <text x="580" y="715" class="attr">optimalThreshold = 0.240</text>
  <text x="580" y="735" class="attr">aucRoc = 0.8635</text>


  <!-- ================= LINKS & RELATIONS ================= -->

  <!-- Session to Developer (Aggregation) -->
  <path d="M 450 105 L 430 105 L 440 100 L 450 105 Z" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <line x1="370" y1="105" x2="430" y2="105" class="line"/>
  <text x="390" y="95" class="label">creates</text>

  <!-- Developer to Dashboard -->
  <line x1="560" y1="180" x2="560" y2="250" class="line"/>
  <text x="570" y="220" class="label">accesses</text>

  <!-- Dashboard Main Branch Trunk -->
  <line x1="560" y1="350" x2="560" y2="400" class="line"/>
  <!-- Dashboard Horizontal Branch -->
  <line x1="160" y1="400" x2="940" y2="400" class="line"/>

  <!-- To Repository (Composition) -->
  <path d="M 160 450 L 155 435 L 160 420 L 165 435 Z" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <line x1="160" y1="400" x2="160" y2="420" class="line"/>
  <text x="170" y="420" class="label">contains</text>

  <!-- To Analysis Request (Composition) -->
  <path d="M 420 450 L 415 435 L 420 420 L 425 435 Z" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <line x1="420" y1="400" x2="420" y2="420" class="line"/>
  <text x="430" y="420" class="label">requests</text>

  <!-- To Prediction Record (Composition) -->
  <path d="M 680 450 L 675 435 L 680 420 L 685 435 Z" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <line x1="680" y1="400" x2="680" y2="420" class="line"/>
  <text x="690" y="420" class="label">displays</text>

  <!-- To Code Review (Composition) -->
  <path d="M 940 450 L 935 435 L 940 420 L 945 435 Z" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <line x1="940" y1="400" x2="940" y2="420" class="line"/>
  <text x="950" y="420" class="label">manages</text>

  <!-- Repo to Commit (Composition) -->
  <path d="M 160 620 L 155 605 L 160 590 L 165 605 Z" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <line x1="160" y1="560" x2="160" y2="590" class="line"/>
  <text x="170" y="585" class="label">tracks</text>

  <!-- Commit to Features (Composition) -->
  <path d="M 160 800 L 155 785 L 160 770 L 165 785 Z" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <line x1="160" y1="750" x2="160" y2="770" class="line"/>
  <text x="170" y="780" class="label">extracts</text>

  <!-- Prediction to Model (Aggregation) -->
  <path d="M 680 640 L 675 625 L 680 610 L 685 625 Z" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <line x1="680" y1="580" x2="680" y2="610" class="line"/>
  <text x="690" y="600" class="label">uses</text>

</svg>
