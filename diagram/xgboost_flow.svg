<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <!-- Base styling for monochrome academic/documentation look -->
  <style>
    .box { fill: #ffffff; stroke: #111111; stroke-width: 1.5; }
    .arrow { stroke: #111111; stroke-width: 1.5; fill: none; }
    .text-title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; font-size: 13px; fill: #111111; }
    .text-body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #333333; }
    .text-header { font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; font-size: 15px; fill: #111111; }
    .badge { fill: #f3f4f6; stroke: #111111; stroke-width: 1; }
  </style>

  <!-- Background (solid white for print-friendly use) -->
  <rect width="900" height="220" fill="#ffffff" />

  <!-- 1. FEATURE EXTRACTION -->
  <g transform="translate(20, 30)">
    <rect class="box" width="170" height="150" rx="4" />
    <text x="15" y="25" class="text-title">1. Feature Extraction</text>
    <line x1="15" y1="32" x2="155" y2="32" stroke="#111111" stroke-width="1" />
    
    <text x="15" y="55" class="text-body">• Size: Added/Deleted Lines</text>
    <text x="15" y="75" class="text-body">• Complexity: Method counts</text>
    <text x="15" y="95" class="text-body">• History: Prior author bugs</text>
    <text x="15" y="115" class="text-body">• Time: Late-night/weekend</text>
    <text x="15" y="135" class="text-body">• Interactions: Night x Complex</text>
  </g>

  <!-- CONNECTOR 1 -->
  <g>
    <path d="M 190,105 L 230,105" class="arrow" />
    <polygon points="230,105 222,101 222,109" fill="#111111" />
  </g>

  <!-- 2. XGBOOST ENSEMBLE -->
  <g transform="translate(240, 30)">
    <rect class="box" width="180" height="150" rx="4" />
    <text x="15" y="25" class="text-title">2. XGBoost Ensemble</text>
    <line x1="15" y1="32" x2="165" y2="32" stroke="#111111" stroke-width="1" />
    
    <text x="15" y="55" class="text-body">• 100 Gradient-Boosted Trees</text>
    <text x="15" y="75" class="text-body">• Imbalance Adjustment</text>
    <text x="25" y="92" class="text-body" font-style="italic">(scale_pos_weight = 18.17)</text>
    <text x="15" y="115" class="text-body">• Aggregate Tree Leaves Score</text>
    <text x="15" y="135" class="text-body" font-weight="bold">• Output: Raw (Skewed) Score</text>
  </g>

  <!-- CONNECTOR 2 -->
  <g>
    <path d="M 420,105 L 460,105" class="arrow" />
    <polygon points="460,105 452,101 452,109" fill="#111111" />
  </g>

  <!-- 3. ISOTONIC CALIBRATION -->
  <g transform="translate(470, 30)">
    <rect class="box" width="180" height="150" rx="4" />
    <text x="15" y="25" class="text-title">3. Isotonic Calibration</text>
    <line x1="15" y1="32" x2="165" y2="32" stroke="#111111" stroke-width="1" />
    
    <text x="15" y="55" class="text-body">• Probability Rescaling</text>
    <text x="15" y="75" class="text-body">• Aligns raw risk margins to</text>
    <text x="25" y="90" class="text-body">empirical bug ratios</text>
    <text x="15" y="115" class="text-body">• Evaluated on Calibration Pool</text>
    <text x="15" y="135" class="text-body" font-weight="bold">• Output: Real probability</text>
  </g>

  <!-- CONNECTOR 3 -->
  <g>
    <path d="M 650,105 L 690,105" class="arrow" />
    <polygon points="690,105 682,101 682,109" fill="#111111" />
  </g>

  <!-- 4. DECISION BANDS -->
  <g transform="translate(700, 30)">
    <rect class="box" width="180" height="150" rx="4" />
    <text x="15" y="25" class="text-title">4. Decision Bands</text>
    <line x1="15" y1="32" x2="165" y2="32" stroke="#111111" stroke-width="1" />
    
    <text x="15" y="52" class="text-body" font-weight="bold">Threshold (t) = 0.240</text>
    
    <!-- Low Risk -->
    <rect x="15" y="68" width="150" height="20" rx="2" fill="none" stroke="#666666" />
    <text x="22" y="82" class="text-body">P &lt; 0.240 : Low Risk</text>
    
    <!-- Medium Risk -->
    <rect x="15" y="93" width="150" height="20" rx="2" fill="none" stroke="#666666" />
    <text x="22" y="107" class="text-body">0.240 ≤ P &lt; 0.450 : Med Risk</text>
    
    <!-- High Risk -->
    <rect x="15" y="118" width="150" height="20" rx="2" fill="none" stroke="#111111" stroke-width="1.5" />
    <text x="22" y="132" class="text-body" font-weight="bold">P ≥ 0.450 : High Risk</text>
  </g>
</svg>
