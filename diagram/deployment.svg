<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" width="700" height="850" style="background-color: white;">
  <defs>
    <!-- Arrowhead Marker -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>

  <!-- Outer Border -->
  <rect x="2" y="2" width="696" height="846" fill="none" stroke="#000" stroke-width="1.5"/>

  <!-- ================= Node 1: Client Computer ================= -->
  <rect x="230" y="60" width="240" height="110" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="350" y="85" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">&lt;&lt;device&gt;&gt;</text>
  <text x="350" y="110" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Client Computer</text>
  <line x1="230" y1="130" x2="470" y2="130" stroke="#000" stroke-width="1.5"/>
  <text x="350" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Web Browser</text>

  <!-- HTTPS Arrow -->
  <line x1="350" y1="170" x2="350" y2="240" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="320" y="195" width="60" height="20" fill="#fff"/>
  <text x="350" y="210" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">HTTPS</text>

  <!-- ================= Node 2: Web Server ================= -->
  <rect x="230" y="250" width="240" height="110" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="350" y="275" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">&lt;&lt;node&gt;&gt;</text>
  <text x="350" y="300" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Web Server</text>
  <line x1="230" y1="320" x2="470" y2="320" stroke="#000" stroke-width="1.5"/>
  <text x="350" y="345" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">React Frontend (Vite + TS)</text>

  <!-- REST API Arrow -->
  <line x1="350" y1="360" x2="350" y2="440" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="310" y="390" width="80" height="20" fill="#fff"/>
  <text x="350" y="405" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">REST API / JWT</text>

  <!-- ================= Node 3: Application Server ================= -->
  <rect x="230" y="450" width="240" height="110" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="350" y="475" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">&lt;&lt;node&gt;&gt;</text>
  <text x="350" y="500" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Application Server</text>
  <line x1="230" y1="520" x2="470" y2="520" stroke="#000" stroke-width="1.5"/>
  <text x="350" y="545" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">FastAPI Monolith (Uvicorn)</text>

  <!-- ================= Branching Lines ================= -->
  <path d="M 350,560 L 350,610" fill="none" stroke="#000" stroke-width="1.5"/>
  <path d="M 180,610 L 520,610" fill="none" stroke="#000" stroke-width="1.5"/>
  <!-- Left Branch -->
  <path d="M 180,610 L 180,650" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Right Branch -->
  <path d="M 520,610 L 520,650" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= Node 4: Database Server ================= -->
  <rect x="60" y="660" width="240" height="110" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="180" y="685" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">&lt;&lt;node&gt;&gt;</text>
  <text x="180" y="710" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Database Server</text>
  <line x1="60" y1="730" x2="300" y2="730" stroke="#000" stroke-width="1.5"/>
  <text x="180" y="755" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Neon PostgreSQL (Cloud)</text>

  <!-- ================= Node 5: GitHub API Server ================= -->
  <rect x="400" y="660" width="240" height="110" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="520" y="685" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">&lt;&lt;node&gt;&gt;</text>
  <text x="520" y="710" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">GitHub API Server</text>
  <line x1="400" y1="730" x2="640" y2="730" stroke="#000" stroke-width="1.5"/>
  <text x="520" y="755" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">GitHub REST API (remote)</text>

</svg>
